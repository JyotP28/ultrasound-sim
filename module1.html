<!DOCTYPE html>
<html>
<head>
    <title>Ultrasound Simulator - Training Sandbox</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="viewports" style="height: 100vh;"> <!-- Fills whole screen -->
        <div id="spatial-view">
            <div class="hud-text top-left" style="color: #ffaa00;">
                <h3>MODULE 1: TRAINING SANDBOX</h3>
                <span id="status">Generating Room PIN...</span><br>
                <span id="room-display" style="font-size: 18px; color: #fff; font-weight: bold;"></span>
            </div>
            <div id="canvas-container-3d"></div>
        </div>

        <div id="us-monitor">
            <div class="hud-text top-left">SIM-HOSPITAL<br>MI: 0.9 TIS: 0.2</div>
            <div class="screen-marker"></div>
            <div class="hud-text top-right">Probe: Curved Array<br>Freq: 3.5 MHz</div>
            <div id="canvas-container-us"></div>
        </div>
    </div>

    <!-- Load Application Logic -->
    <script src="phantom.js"></script>
    <script src="graphics.js"></script>
    <script src="app.js"></script>
</body>
</html>
