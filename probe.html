<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Probe Controller</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; padding: 20px; text-align: center;}
        #login-screen { display: flex; }
        h2 { color: #58a6ff; letter-spacing: 2px; text-transform: uppercase; }
        input[type="number"] { font-size: 24px; padding: 15px; width: 200px; text-align: center; margin-bottom: 20px; border-radius: 8px; border: 2px solid #30363d; background: #161b22; color: white; }
        button { font-size: 20px; padding: 15px 40px; background-color: #238636; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4); margin-bottom: 20px; }
        button:active { background-color: #2ea043; transform: scale(0.98); }
        
        #fire-btn { background-color: #58a6ff; width: 220px; height: 220px; border-radius: 50%; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(88, 166, 255, 0.4); margin-top: 40px; }
        #fire-btn:active { background-color: #79c0ff; box-shadow: 0 0 30px rgba(121, 192, 255, 0.8); }
        #gyro-btn { background-color: #9b59b6; width: 100%; max-width: 300px;}
    </style>
</head>
<body>

    <div id="login-screen" class="screen">
        <h2>Enter Room PIN</h2>
        <input type="number" id="pin-input" placeholder="e.g. 1234">
        <button onclick="connectToSim()">CONNECT</button>
        <div id="status" style="color: #8b949e; margin-top: 15px;">Waiting for PIN...</div>
    </div>

    <div id="probe-screen" class="screen">
        <h2>Transducer Active</h2>
        <button id="gyro-btn" onclick="startMotion()">1. ENABLE MOTION</button>
        <button id="fire-btn" onclick="firePulse()">FIRE PULSE</button>
    </div>

    <script>
        const ABLY_API_KEY = 'a2d6Dg.n1367A:B_CKjjgBzmIV1wt743VG95MCHqBpSXKJp4AK3YQCUVo';

        let activeTransport = null; // 'p2p' or 'ably'
        let p2pConn = null;
        let ablyChannel = null;
        let ablyRealtime = null;

        function connectToSim() {
            const pin = document.getElementById('pin-input').value;
            if (!pin) return;

            document.getElementById('status').innerText = 'Connecting via Direct P2P...';
            document.getElementById('status').style.color = '#8b949e';

            let fallbackTriggered = false;

            const triggerAblyFallback = (reason) => {
                if (fallbackTriggered || activeTransport === 'p2p') return;
                fallbackTriggered = true;
                console.log("P2P Unavailable (" + reason + "). Switching to Ably Relay...");
                connectViaAbly(pin);
            };

            // --- ATTEMPT 1: DIRECT P2P (PEERJS) ---
            try {
                const peer = new Peer();

                // 3-second window to establish direct P2P connection
                const p2pTimeout = setTimeout(() => {
                    peer.destroy();
                    triggerAblyFallback('Timeout');
                }, 3000);

                peer.on('open', () => {
                    p2pConn = peer.connect('sim-hosp-' + pin);

                    p2pConn.on('open', () => {
                        clearTimeout(p2pTimeout);
                        activeTransport = 'p2p';
                        onConnectedSuccess();
                    });

                    p2pConn.on('error', () => {
                        clearTimeout(p2pTimeout);
                        triggerAblyFallback('Connection error');
                    });
                });

                peer.on('error', () => {
                    clearTimeout(p2pTimeout);
                    triggerAblyFallback('Peer error');
                });
            } catch (err) {
                triggerAblyFallback('Init exception');
            }
        }

        // --- ATTEMPT 2: CLOUD RELAY (ABLY) WITH HOST VALIDATION ---
        function connectViaAbly(pin) {
            document.getElementById('status').innerText = 'Connecting via Cloud Relay...';

            ablyRealtime = new Ably.Realtime({ key: ABLY_API_KEY, clientId: 'phone-probe' });
            ablyChannel = ablyRealtime.channels.get('sim-hosp-' + pin);

            // THE FIX: Wait for the channel to fully attach to the cloud BEFORE checking for the laptop!
            ablyChannel.attach((attachErr) => {
                if (attachErr) {
                    document.getElementById('status').innerText = 'Cloud Blocked by Firewall';
                    document.getElementById('status').style.color = '#ff4444';
                    return;
                }

                // Now that we are attached, check if the laptop host is here
                ablyChannel.presence.get((err, members) => {
                    if (err || !members) {
                        document.getElementById('status').innerText = 'Room lookup failed.';
                        document.getElementById('status').style.color = '#ff4444';
                        return;
                    }

                    const hostIsActive = members.some(m => m.clientId === 'laptop-host');

                    if (!hostIsActive) {
                        document.getElementById('status').innerText = 'Invalid PIN or Host Not Active!';
                        document.getElementById('status').style.color = '#ff4444';
                        ablyRealtime.close();
                        return;
                    }

                    // Host confirmed active -> Join room
                    ablyChannel.presence.enter('phone-probe', (enterErr) => {
                        if (enterErr) {
                            document.getElementById('status').innerText = 'Cloud Access Denied';
                            document.getElementById('status').style.color = '#ff4444';
                            return;
                        }

                        activeTransport = 'ably';
                        onConnectedSuccess();

                        ablyChannel.subscribe('host-command', (message) => {
                            if (message.data && message.data.command === 'sync_module') {
                                document.getElementById('fire-btn').style.display = (message.data.module === 1) ? 'flex' : 'none';
                            }
                        });
                    });
                });
            });
        }

        function onConnectedSuccess() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('probe-screen').style.display = 'flex';
        }

        function firePulse() {
            if (activeTransport === 'p2p' && p2pConn && p2pConn.open) {
                p2pConn.send({ fire: true });
            } else if (activeTransport === 'ably' && ablyChannel) {
                ablyChannel.publish('sensor-data', { fire: true });
            }
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function startMotion() {
            document.getElementById('gyro-btn').innerText = "MOTION ACTIVE";
            document.getElementById('gyro-btn').style.backgroundColor = "#238636";
            
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permissionState => {
                    if (permissionState === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        let lastSendTime = 0;
        function handleOrientation(event) {
            const data = { orientation: { alpha: event.alpha, beta: event.beta, gamma: event.gamma } };

            if (activeTransport === 'p2p' && p2pConn && p2pConn.open) {
                p2pConn.send(data);
            } else if (activeTransport === 'ably' && ablyChannel) {
                const now = Date.now();
                if (now - lastSendTime > 30) {
                    lastSendTime = now;
                    ablyChannel.publish('sensor-data', data);
                }
            }
        }
    </script>
</body>
</html>
