<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultrasound Probe Simulator</title>
    <style>
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0d1117; 
            color: white; 
            overflow: hidden; 
            touch-action: none; 
        }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        input { font-size: 24px; padding: 15px; width: 60%; text-align: center; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: white; margin-bottom: 20px; }
        button.connect-btn { font-size: 20px; padding: 15px 40px; border-radius: 8px; border: none; background: #238636; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4); }
        #status { margin-top: 20px; font-size: 16px; color: #8b949e; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="color: #58a6ff; margin-bottom: 10px;">Ultrasound Probe</h1>
        <p style="margin-bottom: 30px; color: #8b949e; text-align: center; width: 80%;">Enter the Room PIN displayed on your laptop to connect.</p>
        
        <input type="number" id="pin-input" placeholder="Room PIN" pattern="[0-9]*" inputmode="numeric">
        <button class="connect-btn" onclick="connectToSim()">Connect to Simulator</button>
        
        <div id="status">Waiting for connection...</div>
    </div>

    <div id="probe-screen" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <h2 style="color: #58a6ff; margin-bottom: 30px; text-shadow: 0 0 10px rgba(88, 166, 255, 0.5);">PROBE CONNECTED</h2>
        
        <!-- SENSOR CONTROLS ONLY -->
        <button id="gyro-btn" onclick="startMotion()" style="padding: 15px 30px; font-size: 20px; border-radius: 8px; border: none; background-color: #8b949e; color: white; font-weight: bold; margin-bottom: 20px; width: 80%;">
            Enable Motion Sensors
        </button>
        
        <button id="fire-btn" onclick="firePulse()" style="padding: 20px 40px; font-size: 24px; border-radius: 50px; border: none; background-color: #ff4444; color: white; font-weight: bold; box-shadow: 0 10px 30px rgba(255, 68, 68, 0.5); display: none;">
            FIRE PULSE
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

    <script>
        // >>> PASTE YOUR ABLY API KEY RIGHT HERE <<<
        const ABLY_API_KEY = 'a2d6Dg.n1367A:B_CKjjgBzmIV1wt743VG95MCHqBpSXKJp4AK3YQCUVo';

        let activeTransport = null;
        let p2pConn = null;
        let ablyChannel = null;
        let ablyRealtime = null;

        function connectToSim() {
            const pin = document.getElementById('pin-input').value;
            if (!pin) return;

            document.getElementById('status').innerText = 'Connecting via Direct P2P...';
            document.getElementById('status').style.color = '#8b949e';

            let fallbackTriggered = false;

            const triggerAblyFallback = (reason) => {
                if (fallbackTriggered || activeTransport === 'p2p') return;
                fallbackTriggered = true;
                console.log("P2P Failed. Reason:", reason);
                document.getElementById('status').innerText = 'Cloud Relay (' + reason + ')...';
                connectViaAbly(pin);
            };

            const p2pTimeout = setTimeout(() => { triggerAblyFallback('Timeout'); }, 6000);

            try {
                const peer = new Peer();

                peer.on('open', () => {
                    p2pConn = peer.connect('sim-hosp-' + pin);

                    p2pConn.on('open', () => {
                        if (fallbackTriggered) return; 
                        clearTimeout(p2pTimeout);
                        activeTransport = 'p2p';
                        onConnectedSuccess();
                    });

                    p2pConn.on('error', (err) => {
                        clearTimeout(p2pTimeout);
                        triggerAblyFallback('Data Error');
                    });
                });

                peer.on('error', (err) => {
                    clearTimeout(p2pTimeout);
                    triggerAblyFallback(err.type); 
                });

            } catch (err) {
                clearTimeout(p2pTimeout);
                triggerAblyFallback('Exception');
            }
        }

        function connectViaAbly(pin) {
            ablyRealtime = new Ably.Realtime({ key: ABLY_API_KEY, clientId: 'phone-probe' });
            ablyChannel = ablyRealtime.channels.get('sim-hosp-' + pin);

            ablyChannel.attach((attachErr) => {
                if (attachErr) {
                    document.getElementById('status').innerText = 'Cloud Blocked by Firewall';
                    document.getElementById('status').style.color = '#ff4444';
                    return;
                }

                ablyChannel.presence.get((err, members) => {
                    if (err || !members) {
                        document.getElementById('status').innerText = 'Room lookup failed.';
                        document.getElementById('status').style.color = '#ff4444';
                        return;
                    }

                    const hostIsActive = members.some(m => m.clientId === 'laptop-host');

                    if (!hostIsActive) {
                        document.getElementById('status').innerText = 'Invalid PIN or Host Not Active!';
                        document.getElementById('status').style.color = '#ff4444';
                        ablyRealtime.close();
                        return;
                    }

                    ablyChannel.presence.enter('phone-probe', (enterErr) => {
                        if (enterErr) {
                            document.getElementById('status').innerText = 'Cloud Access Denied';
                            document.getElementById('status').style.color = '#ff4444';
                            return;
                        }

                        activeTransport = 'ably';
                        onConnectedSuccess();

                        ablyChannel.subscribe('host-command', (message) => {
                            if (message.data && message.data.command === 'sync_module') {
                                document.getElementById('fire-btn').style.display = (message.data.module === 1) ? 'flex' : 'none';
                            }
                        });
                    });
                });
            });
        }

        let wakeLock = null;
        async function enableWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("Wake Lock denied: ", err);
            }
        }

        function onConnectedSuccess() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('probe-screen').style.display = 'flex';
            enableWakeLock();
        }

        function firePulse() {
            if (activeTransport === 'p2p' && p2pConn && p2pConn.open) {
                p2pConn.send({ fire: true });
            } else if (activeTransport === 'ably' && ablyChannel) {
                ablyChannel.publish('sensor-data', { fire: true });
            }
            if (navigator.vibrate) navigator.vibrate(100);
        }

        // --- HARDWARE SENSORS (ZERO LATENCY, SAFE MATH) ---
        let lastP2PSendTime = 0;
        let lastAblySendTime = 0;

        function startMotion() {
            document.getElementById('gyro-btn').innerText = "MOTION ACTIVE";
            document.getElementById('gyro-btn').style.backgroundColor = "#238636";
            
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permissionState => {
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            if (typeof event.alpha !== 'number' || typeof event.beta !== 'number' || typeof event.gamma !== 'number') {
                return;
            }

            const now = Date.now();
            const data = { orientation: { alpha: event.alpha, beta: event.beta, gamma: event.gamma } };
            
            if (activeTransport === 'p2p' && p2pConn && p2pConn.open) {
                // 60Hz Throttle: Prevents WebRTC packet-clumping!
                if (now - lastP2PSendTime > 16) {
                    p2pConn.send(data);
                    lastP2PSendTime = now;
                }
            } else if (activeTransport === 'ably' && ablyChannel) {
                if (now - lastAblySendTime > 33) {
                    ablyChannel.publish('sensor-data', data);
                    lastAblySendTime = now;
                }
            }
        }
    </script>
</body>
</html>
