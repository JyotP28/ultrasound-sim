<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Probe Controller</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; padding: 20px; text-align: center;}
        #login-screen { display: flex; }
        h2 { color: #58a6ff; letter-spacing: 2px; text-transform: uppercase; }
        input[type="number"] { font-size: 24px; padding: 15px; width: 200px; text-align: center; margin-bottom: 20px; border-radius: 8px; border: 2px solid #30363d; background: #161b22; color: white; }
        button { font-size: 20px; padding: 15px 40px; background-color: #238636; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4); margin-bottom: 20px; }
        button:active { background-color: #2ea043; transform: scale(0.98); }
        
        #fire-btn { background-color: #58a6ff; width: 220px; height: 220px; border-radius: 50%; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(88, 166, 255, 0.4); margin-top: 40px; }
        #fire-btn:active { background-color: #79c0ff; box-shadow: 0 0 30px rgba(121, 192, 255, 0.8); }
        #gyro-btn { background-color: #9b59b6; width: 100%; max-width: 300px;}
    </style>
</head>
<body>

    <div id="login-screen" class="screen">
        <h2>Enter Room PIN</h2>
        <input type="number" id="pin-input" placeholder="e.g. 1234">
        <button onclick="connectToSim()">CONNECT</button>
        <div id="status" style="color: #8b949e; margin-top: 15px;">Waiting for PIN...</div>
    </div>

    <div id="probe-screen" class="screen">
        <h2>Transducer Active</h2>
        <button id="gyro-btn" onclick="startMotion()">1. ENABLE MOTION</button>
        <button id="fire-btn" onclick="firePulse()">FIRE PULSE</button>
    </div>

    <script>
        const robustNetworkConfig = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'turn:relay.metered.ca:80', username: 'metered', credential: 'f9378627b0032b49b294028e3524810a90558bb92261ac24050a41d9e71b2651' },
                    { urls: 'turn:relay.metered.ca:443', username: 'metered', credential: 'f9378627b0032b49b294028e3524810a90558bb92261ac24050a41d9e71b2651' }
                ],
                // Force the phone to bounce data externally as well
                'iceTransportPolicy': 'relay'
            }
        };

        const peer = new Peer(robustNetworkConfig); 
        let conn;

        function connectToSim() {
            const pin = document.getElementById('pin-input').value;
            conn = peer.connect('sim-hosp-' + pin);
            
            document.getElementById('status').innerText = 'Bypassing Firewall...';

            conn.on('open', () => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('probe-screen').style.display = 'flex';
                
                conn.on('data', (data) => {
                    if (data.command === 'sync_module') {
                        document.getElementById('fire-btn').style.display = (data.module === 1) ? 'flex' : 'none';
                    }
                });
            });
        }

        function firePulse() {
            if (conn && conn.open) conn.send({ fire: true });
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function startMotion() {
            document.getElementById('gyro-btn').innerText = "MOTION ACTIVE";
            document.getElementById('gyro-btn').style.backgroundColor = "#238636";
            
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permissionState => {
                    if (permissionState === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            if (conn && conn.open) {
                conn.send({ orientation: { alpha: event.alpha, beta: event.beta, gamma: event.gamma } });
            }
        }
    </script>
