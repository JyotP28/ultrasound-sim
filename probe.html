<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Probe</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #111; color: white; font-family: sans-serif; margin: 0; }
        
        /* Setup Screen */
        #setup-screen { display: flex; flex-direction: column; align-items: center; }
        input { padding: 15px; font-size: 24px; text-align: center; margin-bottom: 20px; border-radius: 8px; border: 2px solid #555; background: #222; color: #fff; width: 180px; }
        .btn { padding: 20px 40px; font-size: 20px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; width: 250px; margin-bottom: 15px; transition: 0.2s; }
        .btn-connect { background: #00ffcc; color: #000; }
        
        /* Controller Screen (Hidden by default) */
        #controller-screen { display: none; flex-direction: column; align-items: center; width: 100%; padding: 20px; box-sizing: border-box; }
        .btn-freeze { background: #444; color: #fff; height: 80px; font-size: 24px; border: 2px solid #666; }
        .btn-freeze.frozen { background: #ff4444; color: white; border-color: #ffaaaa; }
        
        .slider-container { width: 90%; margin-top: 40px; text-align: center; }
        input[type=range] { width: 100%; margin-top: 15px; }
        
        #log { font-family: monospace; font-size: 14px; color: #aaa; margin-top: 20px;}
    </style>
</head>
<body>
    <!-- Screen 1: Connection -->
    <div id="setup-screen">
        <h3 style="margin-bottom: 10px;">Enter Room PIN</h3>
        <input type="number" id="pinInput" placeholder="1234" />
        <button class="btn btn-connect" id="startBtn">Connect Probe</button>
        <div id="log">Status: Idle</div>
    </div>

    <!-- Screen 2: Live Controls -->
    <div id="controller-screen">
        <h2 style="color: #00ffcc; margin-top: 0;">Live Transmission</h2>
        
        <button class="btn btn-freeze" id="freezeBtn">FREEZE IMAGE</button>
        
        <div class="slider-container">
            <h3>Depth: <span id="depthVal">10</span> cm</h3>
            <input type="range" id="depthSlider" min="2" max="10" step="1" value="10">
        </div>
    </div>

    <script>
        let conn = null;
        let isFrozen = false;
        let currentDepth = 10;
        const log = document.getElementById('log');

        // UI Event Listeners
        document.getElementById('freezeBtn').addEventListener('click', (e) => {
            isFrozen = !isFrozen;
            e.target.innerText = isFrozen ? "UNFREEZE IMAGE" : "FREEZE IMAGE";
            e.target.classList.toggle('frozen');
        });

        document.getElementById('depthSlider').addEventListener('input', (e) => {
            currentDepth = e.target.value;
            document.getElementById('depthVal').innerText = currentDepth;
        });

        function sendState(event) {
            if (conn && conn.open) {
                // Send the orientation AND the button/slider states!
                conn.send({ 
                    a: event.alpha, 
                    b: event.beta, 
                    g: event.gamma,
                    freeze: isFrozen,
                    depth: currentDepth
                });
            }
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            const pin = document.getElementById('pinInput').value;
            if(pin.length !== 4) return alert('Enter a 4-digit PIN.');

            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') return;
                }

                window.addEventListener('deviceorientation', sendState, true);

                log.innerText = 'Connecting...';
                const peer = new Peer();

                peer.on('open', () => {
                    conn = peer.connect('sim-hosp-' + pin);
                    
                    conn.on('open', () => {
                        // Hide setup screen, show controller!
                        document.getElementById('setup-screen').style.display = 'none';
                        document.getElementById('controller-screen').style.display = 'flex';
                    });
                });
            } catch (e) { log.innerText = 'Error: ' + e.message; }
        });
    </script>
</body>
</html>
