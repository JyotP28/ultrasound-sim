<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Probe Controller</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #login-screen, #controller-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        #controller-screen {
            display: none; /* Hidden until connected */
        }

        h2 { color: #58a6ff; letter-spacing: 2px; text-transform: uppercase; }
        
        input {
            font-size: 24px;
            padding: 15px;
            width: 200px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 2px solid #30363d;
            background: #161b22;
            color: white;
        }

        button {
            font-size: 20px;
            padding: 15px 40px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
        }

        button:active { background-color: #2ea043; transform: scale(0.98); }

        #status { margin-top: 20px; font-size: 16px; color: #8b949e; }

        /* The Big "Fire" Button for Level 1 */
        #fire-btn {
            background-color: #58a6ff;
            box-shadow: 0 4px 20px rgba(88, 166, 255, 0.4);
            width: 250px;
            height: 250px;
            border-radius: 50%;
            font-size: 28px;
            margin-top: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #fire-btn:active {
            background-color: #79c0ff;
            box-shadow: 0 0 30px rgba(121, 192, 255, 0.8);
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: LOGIN -->
    <div id="login-screen">
        <h2>Enter Room PIN</h2>
        <input type="number" id="pin-input" placeholder="e.g. 1234">
        <button onclick="connectToSim()">CONNECT</button>
        <div id="status">Waiting for PIN...</div>
    </div>

    <!-- SCREEN 2: CONTROLLER -->
    <div id="controller-screen">
        <h2>Transducer Active</h2>
        <div id="status-connected" style="color: #44ff44; margin-bottom: 30px;">Connected to Simulator</div>
        
        <!-- The Level 1 Action Button -->
        <button id="fire-btn" onclick="firePulse()">FIRE<br>PULSE</button>
    </div>

    <script>
        const peer = new Peer();
        let conn;

        function connectToSim() {
            const pin = document.getElementById('pin-input').value;
            const roomId = 'sim-hosp-' + pin;
            document.getElementById('status').innerText = 'Connecting...';

            conn = peer.connect(roomId);

            conn.on('open', () => {
                // Switch UI from Login to Controller
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('controller-screen').style.display = 'flex';
                
                // For mobile browsers to allow audio/vibration later, 
                // we trigger a tiny haptic feedback if supported!
                if (navigator.vibrate) navigator.vibrate(50);
            });

            conn.on('error', (err) => {
                document.getElementById('status').innerText = 'Connection Failed. Try again.';
                document.getElementById('status').style.color = '#ff4444';
            });
        }

        function firePulse() {
            if (conn && conn.open) {
                // Send the exact command the State Machine is looking for!
                conn.send({ fire: true });
                
                // Haptic feedback so the student feels the "pulse"
                if (navigator.vibrate) navigator.vibrate(100);
            }
        }
    </script>
</body>
</html>
