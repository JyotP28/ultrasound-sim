<!DOCTYPE html>
<html>
<head>
    <title>Ultrasound Monitor</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; color: white; font-family: sans-serif; }
        #debug { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="debug">
        <h2 id="status" style="margin:0 0 10px 0; color: #ffcc00;">Initializing Peer...</h2>
        <div id="angles">Awaiting orientation data...</div>
    </div>

    <script>
        // 1. Setup Three.js Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const organ = new THREE.Mesh(
            new THREE.SphereGeometry(2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xaa4444, wireframe: true })
        );
        scene.add(organ);

        const slicePlane = new THREE.Mesh(
            new THREE.PlaneGeometry(4, 4),
            new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, transparent: true, opacity: 0.7 })
        );
        scene.add(slicePlane);
        camera.position.z = 6;

        // 2. PeerJS Connection
        const peer = new Peer('us-sim-room-1');

        peer.on('open', (id) => {
            document.getElementById('status').innerText = 'Ready! Waiting for probe...';
            document.getElementById('status').style.color = '#00ffcc';
        });

        peer.on('error', (err) => {
            document.getElementById('status').innerText = 'Error: ' + err.type;
            document.getElementById('status').style.color = '#ff4444';
        });

        peer.on('connection', conn => {
            document.getElementById('status').innerText = 'Probe Connected!';
            document.getElementById('status').style.color = '#44ff44';

            conn.on('data', data => {
                if(data.a !== undefined && data.a !== null) {
                    document.getElementById('angles').innerText = 
                        `Alpha: ${Math.round(data.a)}° | Beta: ${Math.round(data.b)}° | Gamma: ${Math.round(data.g)}°`;

                    const euler = new THREE.Euler(
                        THREE.MathUtils.degToRad(data.b),
                        THREE.MathUtils.degToRad(data.a),
                        THREE.MathUtils.degToRad(-data.g),
                        'YXZ'
                    );
                    slicePlane.setRotationFromEuler(euler);
                }
            });
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
