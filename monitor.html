<!DOCTYPE html>
<html>
<head>
    <title>Ultrasound Simulator - Assessment Module</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column;}
        
        #viewports { display: flex; width: 100vw; height: 85vh; }
        #spatial-view { width: 50vw; height: 100%; position: relative; border-right: 2px solid #333; }
        #us-monitor { width: 50vw; height: 100%; position: relative; background: #050505; }
        
        /* The Assessment Control Panel */
        #control-panel { height: 15vh; background: #111; border-top: 2px solid #333; display: flex; align-items: center; justify-content: space-around; padding: 0 20px; }
        .diag-btn { background: #222; color: #fff; border: 2px solid #555; padding: 15px 30px; font-size: 16px; font-family: 'Courier New', Courier, monospace; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        .diag-btn:hover { background: #444; border-color: #00ffcc; }
        .diag-btn.cyst { border-bottom: 4px solid #000; }
        .diag-btn.mass { border-bottom: 4px solid #777; }
        .diag-btn.bone { border-bottom: 4px solid #fff; }
        
        .hud-text { position: absolute; z-index: 10; font-size: 14px; text-shadow: 1px 1px 0 #000; color: #00ffcc; pointer-events: none; }
        .top-left { top: 20px; left: 20px; }
        .top-right { top: 20px; right: 20px; text-align: right; }
        .bottom-right { bottom: 20px; right: 20px; color: #aaa; text-align: right; }
        
        #score-board { font-size: 24px; color: #ffaa00; text-align: center; }
        #feedback { font-size: 18px; color: #aaa; margin-top: 5px; }

        .depth-ruler { position: absolute; right: 10px; top: 15%; height: 70%; display: flex; flex-direction: column; justify-content: space-between; color: #aaa; font-size: 10px; }
        .depth-tick { width: 10px; border-bottom: 1px solid #555; text-align: right; padding-right: 15px; }
        .screen-marker { position: absolute; top: 75px; left: 20px; width: 14px; height: 14px; background-color: #ffff00; border-radius: 50%; z-index: 10; box-shadow: 0 0 5px #000; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="viewports">
        <div id="spatial-view">
            <div class="hud-text top-left" style="color: #ffaa00;">
                <h3>MODULE 2: BLIND PHANTOM</h3>
                <span id="status">Waiting for probe connection...</span>
            </div>
            <div id="canvas-container-3d"></div>
        </div>

        <div id="us-monitor">
            <div class="hud-text top-left">SIM-HOSPITAL<br>MI: 0.9 TIS: 0.2</div>
            <div class="screen-marker"></div>
            <div class="hud-text top-right">Probe: Curved Array<br>Freq: 3.5 MHz</div>
            <div class="depth-ruler">
                <div class="depth-tick">0cm</div><div class="depth-tick">2cm</div>
                <div class="depth-tick">4cm</div><div class="depth-tick">6cm</div>
                <div class="depth-tick">8cm</div><div class="depth-tick">10cm</div>
            </div>
            <div id="canvas-container-us"></div>
        </div>
    </div>

    <!-- NEW: The Game UI -->
    <div id="control-panel">
        <div id="score-board">
            Score: <span id="score-val" style="color:#fff;">0</span>
            <div id="feedback">Scan the block to find the hidden anomaly.</div>
        </div>
        <button class="diag-btn cyst" onclick="makeDiagnosis('Cyst')">Diagnose: Anechoic Cyst</button>
        <button class="diag-btn mass" onclick="makeDiagnosis('Mass')">Diagnose: Isoechoic Mass</button>
        <button class="diag-btn bone" onclick="makeDiagnosis('Bone')">Diagnose: Calcification</button>
    </div>

    <script>
        let score = 0;
        let currentDiagnosis = '';
        const size = 64;
        const volumeData = new Uint8Array(size * size * size);
        const texture3D = new THREE.DataTexture3D(volumeData, size, size, size);
        texture3D.format = THREE.RedFormat;
        texture3D.type = THREE.UnsignedByteType;
        texture3D.minFilter = texture3D.magFilter = THREE.LinearFilter;
        texture3D.unpackAlignment = 1;

        // ==========================================
        // NEW: THE GAME LOOP RANDOMIZER
        // ==========================================
        function generateNewTest() {
            // Pick a random location inside the phantom
            const rx = (Math.random() - 0.5) * 1.2; 
            const ry = (Math.random() - 0.5) * 1.2;
            const rz = (Math.random() - 0.5) * 1.2;

            // Pick a random pathology
            const pathologies = [
                { name: 'Cyst', density: 5, radius: 0.25 }, // Black fluid
                { name: 'Mass', density: 160, radius: 0.3 }, // Bright gray tissue
                { name: 'Bone', density: 250, radius: 0.15 } // White with shadow
            ];
            const target = pathologies[Math.floor(Math.random() * pathologies.length)];
            currentDiagnosis = target.name;

            // Generate the new block data
            for (let z = 0; z < size; z++) {
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const index = (z * size * size) + (y * size) + x;
                        const nx = (x / size) * 2 - 1;
                        const ny = (y / size) * 2 - 1;
                        const nz = (z / size) * 2 - 1;
                        
                        let density = 100 + Math.random() * 30; // Normal background tissue
                        
                        // If coordinates are inside our random sphere, change the density
                        if (Math.sqrt(Math.pow(nx-rx, 2) + Math.pow(ny-ry, 2) + Math.pow(nz-rz, 2)) < target.radius) {
                            density = target.density;
                        }
                        volumeData[index] = density;
                    }
                }
            }
            // Tell the GPU to update the shader with the new data
            texture3D.needsUpdate = true;
        }

        function makeDiagnosis(guess) {
            const feedbackEl = document.getElementById('feedback');
            if (guess === currentDiagnosis) {
                score += 10;
                document.getElementById('score-val').innerText = score;
                feedbackEl.innerText = "Correct! Generating next case...";
                feedbackEl.style.color = "#44ff44";
                
                // Wait 1.5 seconds, then load the next case
                setTimeout(() => {
                    feedbackEl.innerText = "Scan the block to find the hidden anomaly.";
                    feedbackEl.style.color = "#aaa";
                    generateNewTest();
                }, 1500);
            } else {
                score -= 5;
                document.getElementById('score-val').innerText = score;
                feedbackEl.innerText = `Incorrect. Look closer at the echogenicity and shadows.`;
                feedbackEl.style.color = "#ff4444";
            }
        }

        // Initialize the first level!
        generateNewTest();

        // ==========================================
        // 2. SETUP THE LEFT VIEWPORT (3D SPATIAL)
        // ==========================================
        const scene3D = new THREE.Scene();
        const viewportWidth = window.innerWidth / 2;
        const viewportHeight = window.innerHeight * 0.85; // Account for UI panel
        const camera3D = new THREE.PerspectiveCamera(50, viewportWidth / viewportHeight, 0.1, 100);
        camera3D.position.set(0, 1.5, 4.5); 
        camera3D.lookAt(0, 0, 0);

        const renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer3D.setSize(viewportWidth, viewportHeight);
        document.getElementById('canvas-container-3d').appendChild(renderer3D.domElement);

        const phantomBox = new THREE.Mesh(
            new THREE.BoxGeometry(2, 2, 2),
            new THREE.MeshBasicMaterial({ color: 0x444444, wireframe: true })
        );
        scene3D.add(phantomBox);
        // Note: The cheating spheres are GONE!

        const probePlane = new THREE.Group();
        const planeGeo = new THREE.PlaneGeometry(2, 2);
        planeGeo.translate(0, -1, 0); 
        const planeMesh = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, transparent: true, opacity: 0.3 }));
        probePlane.add(planeMesh);

        const handleGeo = new THREE.BoxGeometry(0.8, 1.5, 0.2); 
        handleGeo.translate(0, 0.75, 0);
        const handleMesh = new THREE.Mesh(handleGeo, new THREE.MeshBasicMaterial({ color: 0x888888 }));
        probePlane.add(handleMesh);
        
        const markerGeometry = new THREE.SphereGeometry(0.1, 16, 16);
        const markerMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const marker3D = new THREE.Mesh(markerGeometry, markerMaterial);
        marker3D.position.set(-0.45, 0.1, 0); 
        probePlane.add(marker3D);

        probePlane.position.set(0, 1.2, 0); 
        scene3D.add(probePlane);

        // ==========================================
        // 3. SETUP THE RIGHT VIEWPORT (2D ULTRASOUND)
        // ==========================================
        const sceneUS = new THREE.Scene();
        const cameraUS = new OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        cameraUS.position.z = 1;

        const rendererUS = new THREE.WebGLRenderer({ antialias: true });
        rendererUS.setSize(viewportWidth, viewportHeight);
        document.getElementById('canvas-container-us').appendChild(rendererUS.domElement);

        const usMaterial = new THREE.ShaderMaterial({
            uniforms: {
                u_volume: { value: texture3D },
                u_matrix: { value: new THREE.Matrix4() }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;
                precision highp sampler3D;
                uniform sampler3D u_volume;
                uniform mat4 u_matrix;
                varying vec2 vUv;

                float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }

                void main() {
                    vec2 center = vec2(0.5, 1.0); 
                    float dist = distance(vUv, center);
                    if (dist > 0.9 || dist < 0.1 || vUv.y > 0.9) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }

                    float localX = (vUv.x * 2.0) - 1.0;
                    float localY = (vUv.y * 2.0) - 2.0; 
                    vec4 localPos = vec4(localX, localY, 0.0, 1.0);
                    vec4 worldPos = u_matrix * localPos;
                    vec3 texCoord = worldPos.xyz * 0.5 + 0.5;

                    if (texCoord.x < 0.0 || texCoord.x > 1.0 || texCoord.y < 0.0 || texCoord.y > 1.0 || texCoord.z < 0.0 || texCoord.z > 1.0) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return;
                    }

                    float density = texture(u_volume, texCoord).r;
                    float shadowMultiplier = 1.0;
                    vec2 rayDir = center - vUv; 
                    vec2 stepSize = rayDir / 50.0;
                    vec2 checkUv = vUv;
                    
                    for(int i = 1; i <= 50; i++) {
                        checkUv += stepSize;
                        float sX = (checkUv.x * 2.0) - 1.0;
                        float sY = (checkUv.y * 2.0) - 2.0;
                        vec4 sLocal = vec4(sX, sY, 0.0, 1.0);
                        vec4 sWorld = u_matrix * sLocal;
                        vec3 sTexCoord = sWorld.xyz * 0.5 + 0.5;
                        
                        if (sTexCoord.x >= 0.0 && sTexCoord.x <= 1.0 && sTexCoord.y >= 0.0 && sTexCoord.y <= 1.0 && sTexCoord.z >= 0.0 && sTexCoord.z <= 1.0) {
                            float densityAbove = texture(u_volume, sTexCoord).r;
                            if (densityAbove > 0.9) { shadowMultiplier = 0.1; break; }
                        }
                    }

                    float speckle = 0.6 + (0.4 * random(vUv)); 
                    float finalOutput = density * shadowMultiplier * speckle;
                    gl_FragColor = vec4(finalOutput, finalOutput, finalOutput, 1.0);
                }
            `
        });

        const usScreen = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), usMaterial);
        sceneUS.add(usScreen);

        // ==========================================
        // 4. NETWORKING & ANIMATION
        // ==========================================
        const peer = new Peer('us-sim-room-1');

        peer.on('connection', conn => {
            document.getElementById('status').innerText = 'Probe Connected!';
            document.getElementById('status').style.color = '#00ffcc';

            conn.on('data', data => {
                if(data.a !== undefined && data.a !== null) {
                    const euler = new THREE.Euler(
                        THREE.MathUtils.degToRad(data.b),
                        THREE.MathUtils.degToRad(data.a),
                        THREE.MathUtils.degToRad(-data.g),
                        'YXZ'
                    );
                    const q = new THREE.Quaternion().setFromEuler(euler);
                    const tiltOffset = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
                    q.multiply(tiltOffset);
                    
                    probePlane.setRotationFromQuaternion(q);
                    probePlane.updateMatrixWorld();
                    usMaterial.uniforms.u_matrix.value.copy(probePlane.matrixWorld);
                }
            });
        });

        window.addEventListener('resize', () => {
            const newWidth = window.innerWidth / 2;
            const newHeight = window.innerHeight * 0.85;
            renderer3D.setSize(newWidth, newHeight);
            camera3D.aspect = newWidth / newHeight;
            camera3D.updateProjectionMatrix();
            rendererUS.setSize(newWidth, newHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer3D.render(scene3D, camera3D);
            rendererUS.render(sceneUS, cameraUS);
        }
        animate();
    </script>
</body>
</html>
