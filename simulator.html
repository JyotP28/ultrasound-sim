<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrasound 101: Interactive Curriculum</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Core Libraries -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- The Gamified Instructor HUD -->
    <div id="instructor-hud">
        <h2 id="hud-title">Loading Curriculum...</h2>
        <p id="hud-instructions">Please wait.</p>
        <div id="hud-progress">Step <span id="step-count">0</span>/3</div>
    </div>

    <!-- Dual Monitor Layout -->
    <div id="viewports">
        
        <!-- Left Screen: The 3D Spatial World -->
        <div id="spatial-view">
            <div class="hud-text top-left">
                <h3>SPATIAL VIEW</h3>
                <span id="status" style="color: #ffcc00;">Initializing Network...</span><br>
                <span id="room-display" style="font-size: 18px; color: #fff; font-weight: bold;"></span>
            </div>
            <div id="canvas-container-3d"></div>
        </div>

        <!-- Right Screen: The 2D Ultrasound Monitor -->
        <div id="us-monitor">
            <div class="hud-text top-left">SIM-CLINIC<br>MI: 0.9 TIS: 0.2</div>
            <div class="screen-marker"></div>
            <div class="hud-text top-right">Probe: Linear<br>Freq: 10.0 MHz</div>
            <div id="canvas-container-us"></div>
        </div>

    </div>

    <!-- Application Logic (Loaded in sequential order) -->
    <script src="graphics.js"></script>
    <script src="module2.js"></script> <!-- ADD THIS LINE -->
    <script src="app.js"></script>
</body>
</html>
